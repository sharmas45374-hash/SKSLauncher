name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          sudo apt update && sudo apt install -y wget unzip
          mkdir -p app_pojavlauncher/libs
          cd app_pojavlauncher/libs
          wget -q https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Get JREs from Releases
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-new
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-21
          wget -q https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre8-pojav/jre8-pojav.zip -O /tmp/jre8.zip
          unzip -q /tmp/jre8.zip -d app_pojavlauncher/src/main/assets/components/jre
          wget -q https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre17-pojav/jre17-pojav.zip -O /tmp/jre17.zip
          unzip -q /tmp/jre17.zip -d app_pojavlauncher/src/main/assets/components/jre-new
          wget -q https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre21-pojav/jre21-pojav.zip -O /tmp/jre21.zip
          unzip -q /tmp/jre21.zip -d app_pojavlauncher/src/main/assets/components/jre-21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh
          mkdir -p out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SKSLauncher-debug
          path: out/app-debug.apk
          
