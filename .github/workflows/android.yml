name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Safe Clean & Rebrand to SKSLauncher
        run: |
          python3 - << 'EOF'
          import glob, os, shutil

          # 1. Fix broken/unclosed strings.xml safely without git checkout
          sfile = "app_pojavlauncher/src/main/res/values/strings.xml"
          with open(sfile, "r", encoding="utf-8", errors="ignore") as f:
              lines = [l for l in f.readlines() if "</resources>" not in l]
          txt = "".join(lines) + "\n</resources>\n"
          txt = txt.replace("PojavLauncher (Minecraft: Java Edition for Android)", "SKSLauncher")
          txt = txt.replace("PojavLauncher", "SKSLauncher").replace("Pojav", "SKS")
          with open(sfile, "w", encoding="utf-8") as f:
              f.write(txt)

          # 2. Remove duplicate/broken ic_pojav_full.png if webp exists, or clean icons
          webp = "app_pojavlauncher/src/main/res/drawable/ic_pojav_full.webp"
          png = "app_pojavlauncher/src/main/res/drawable/ic_pojav_full.png"
          if os.path.exists(webp) and os.path.exists(png):
              os.remove(png)

          # 3. Re-save all custom pngs using python PIL if available so AAPT2 never fails
          try:
              from PIL import Image
              for p in glob.glob("app_pojavlauncher/src/main/res/**/*.png", recursive=True):
                  try:
                      im = Image.open(p).convert("RGBA")
                      im.save(p, "PNG")
                  except Exception:
                      pass
          except ImportError:
              pass
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW and JRE Runtimes
        run: |
          python3 - << 'EOF'
          import json, os, urllib.request, zipfile

          os.makedirs("app_pojavlauncher/libs", exist_ok=True)
          os.makedirs("app_pojavlauncher/src/main/assets/components", exist_ok=True)

          def fetch_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          def download(url, dest):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=120) as r, open(dest, "wb") as f:
                  f.write(r.read())

          ltw_path = "app_pojavlauncher/libs/ltw-release.aar"
          if not os.path.exists(ltw_path):
              for repo in ["AngelAuraMC/LTW", "PojavLauncherTeam/LTW"]:
                  try:
                      releases = fetch_json(f"https://api.github.com/repos/{repo}/releases")
                      for rel in releases:
                          for asset in rel.get("assets", []):
                              if asset["name"].endswith(".aar"):
                                  download(asset["browser_download_url"], ltw_path)
                                  break
                          if os.path.exists(ltw_path):
                              break
                  except Exception:
                      pass
                  if os.path.exists(ltw_path):
                      break

          for repo in ["AngelAuraMC/Amethyst-Android", "PojavLauncherTeam/PojavLauncher"]:
              try:
                  releases = fetch_json(f"https://api.github.com/repos/{repo}/releases")
                  apk_url = None
                  for rel in releases:
                      for asset in rel.get("assets", []):
                          if asset["name"].endswith(".apk") and "noruntime" not in asset["name"].lower():
                              apk_url = asset["browser_download_url"]
                              break
                      if apk_url:
                          break
                  if apk_url:
                      download(apk_url, "/tmp/base.apk")
                      with zipfile.ZipFile("/tmp/base.apk", "r") as z:
                          for member in z.namelist():
                              if member.startswith("assets/components/jre"):
                                  rel_path = member[len("assets/components/"):]
                                  target = os.path.join("app_pojavlauncher/src/main/assets/components", rel_path)
                                  if member.endswith("/"):
                                      os.makedirs(target, exist_ok=True)
                                  else:
                                      os.makedirs(os.path.dirname(target), exist_ok=True)
                                      with z.open(member) as src, open(target, "wb") as dst:
                                          dst.write(src.read())
                      break
              except Exception:
                  pass
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SKSLauncher-debug
          path: out/app-debug.apk
          
